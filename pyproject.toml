[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-mcp-server"
version = "1.0.0"
description = "An MCP server that exposes GitHub repos, issues, and pull requests as tools for AI clients."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bakang" }]
keywords = ["mcp", "github", "ai", "llm", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
github-mcp-server = "github_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
"Homepage" = "https://github.com/yourusername/github-mcp-server"
"Bug Tracker" = "https://github.com/yourusername/github-mcp-server/issues"
