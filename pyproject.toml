
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-mcp-server"
version = "1.0.0"
description = "A Model Context Protocol server enabling AI clients to interact with GitHub."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bakang Mabilo" }]

keywords = [
    "mcp",
    "github",
    "ai",
    "llm",
    "automation",
    "developer-tools"
]

dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[project.scripts]
github-mcp-server = "server:main"

[tool.setuptools]
py-modules = ["server"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[project.urls]
Homepage = "https://github.com/OfficialBakang/github-mcp-server"
Repository = "https://github.com/OfficialBakang/github-mcp-server"
"Bug Tracker" = "https://github.com/OfficialBakang/github-mcp-server/issues"
